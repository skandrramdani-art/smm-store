<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة رشق أعضاء تليجرام</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h2>تجربة رشق أعضاء قناة تليجرام</h2>
    <input type="text" id="channel_url" placeholder="أدخل رابط القناة (https://t.me/...)" style="width: 300px; padding: 8px;">
    <button onclick="sendOrder()" style="padding: 8px 15px;">إرسال الأعضاء</button>
    <div id="result" style="margin-top: 20px; font-weight: bold;"></div>

    <script>
    function sendOrder() {
        const url = document.getElementById('channel_url').value;
        const resultDiv = document.getElementById('result');
        
        if(!url) { alert('يرجى إدخال الرابط'); return; }

        resultDiv.innerText = "جاري إرسال الطلب...";

        // استبدل الـ URL والـ Key ببيانات سيرفر الرشق الخاص بك
        fetch('https://EXAMPLE-SMM-PROVIDER.COM/api/v2', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                'key': 'YOUR_API_KEY_HERE',
                'action': 'add',
                'service': 101,
                'link': url,
                'quantity': 100
            })
        })
        .then(res => res.json())
        .then(data => {
            resultDiv.innerHTML = `<span style="color:green;">تم الإرسال! رقم الطلب: ${data.order || JSON.stringify(data)}</span>`;
        })
        .catch(err => {
            resultDiv.innerHTML = `<span style="color:red;">حدث خطأ أثناء الإرسال</span>`;
        });
    }
    </script>
</body>
</html>
