<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر رشق تلغرام</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 50px; }
        .box { background: #333; padding: 30px; border-radius: 15px; max-width: 400px; margin: auto; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #0088cc; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>متجر رشق تلغرام 🚀</h1>
        <p>ارفع متابعين قناتك بسهولة</p>
        <input type="text" id="username" placeholder="رابط القناة">
        <input type="number" id="count" placeholder="العدد المطلوب">
        <button onclick="startOrder()">بدء الرشق</button>
    </div>
    <script>
        function startOrder() {
            alert("تم استلام الطلب! سيبدأ النظام بالعمل فور ربط الـ API.");
        }
    </script>
</body>
</html>
